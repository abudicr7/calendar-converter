<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>calendar converter</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
                background-attachment: fixed;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #e0f2fe;
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
                text-align: center;
                font-size: 1.8rem;
            }

            main {
                background: rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 16px;
                padding: 30px;
                width: 100%;
                max-width: 420px;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                box-sizing: border-box;
            }

            label {
                color: #bae6fd;
                font-weight: 600;
                font-size: 0.95rem;
                display: block;
                margin-bottom: 5px;
            }

            input[type="number"], select {
                width: 100%;
                padding: 12px;
                background: rgba(255, 255, 255, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 8px;
                color: #ffffff;
                font-size: 1rem;
                box-sizing: border-box;
                outline: none;
                transition: all 0.2s;
            }

            input[type="number"]::placeholder {
                color: rgba(255, 255, 255, 0.6);
            }

            select option {
                background-color: #1e293b;
                color: #ffffff;
            }

            input[type="number"]:focus, select:focus {
                border-color: #38bdf8;
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            }

            button {
                background: rgba(56, 189, 248, 0.25);
                border: 1px solid rgba(56, 189, 248, 0.5);
                color: #ffffff;
                padding: 10px 14px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                font-size: 0.9rem;
            }

            button:hover {
                background: rgba(56, 189, 248, 0.5);
                box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            }

            button.active {
                background: #0284c7;
                border-color: #38bdf8;
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            }

            button[type="submit"] {
                width: 100%;
                padding: 14px;
                background: #0284c7;
                border: 1px solid #38bdf8;
                font-size: 1.1rem;
                font-weight: bold;
                margin-top: 10px;
            }

            button[type="submit"]:hover {
                background: #0369a1;
            }

            h2 {
                color: #bae6fd;
                margin-top: 25px;
                margin-bottom: 5px;
                font-size: 1.1rem;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            p {
                margin: 0;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 12px;
                border-radius: 8px;
                color: #e0f2fe;
                font-weight: bold;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Ethipoia and gregorian calender converter</h1>
       
        <main>
            <button type="button" id="btnEthToGreg" class="active" onclick="setDirection('ethToGreg')">Ethiopian → Gregorian</button>
            <br><br>
            <button type="button" id="btnGregToEth" onclick="setDirection('gregToEth')">Gregorian → Ethiopian</button>
            <br><br>
            <form onsubmit="event.preventDefault(); convert();">
                <label for="day">Day:</label>
                <input type="number" id="day" min="1" max="31" placeholder="e.g. 24" required>
                <br><br>
                <label for="month">month:</label>
                <select id="month" required></select>
                <br><br>
                <label for="year">year:</label>
                <input type="number" id="year" min="1" max="9999" placeholder="e.g. 2012" required>
                <br><br>
                <button type="button" onclick="setTodayDate()">Use Today's Date</button>
                <br><br>
                <button type="submit">convert</button>
            </form>
            <h2>result :</h2>
            <p id="output-result">enter date above and click convert</p>
        </main>

        
        <script src="converter.js"></script>
    </body>
